cooldown: 3
lockpick-range: -1

traits:
    - thief

keys:
  iron_key:
    item: "v.iron_nugget"
    strength: 0.2
  gold_key:
    item: "v.gold_nugget"
    strength: 0.5

lockpicks:
  iron_lockpick:
    item: "v.iron_ingot"
    strength: 0.35
    capacity: 30

category_points: 30
point_gain_interval: 24

default_value: 0.1

masks:
  ghost_mask:
    item: m.masks.ghost_mask

masked-channels:
  rp:
    commands: [rp]
    format: '&fMasked&e: &f"&e{message}&f"'
    range: 15

  shout:
    commands: [shout]
    format: '&fMasked&6 shouts: &f"&6{message}&f"'
    range: 24

  yell:
    commands: [yell, y]
    format: '&fMasked&c yells: &f"&c&l{message}&f"'
    range: 48

  whisper:
    commands: [whisper, wh]
    format: '&fMasked#55aaff whispers: &f&o"#55aaff&o{message}&f&o"'
    range: 2

  looc:
    commands: [looc]
    format: '&f[&2LOOC&f] &fMasked: &7{message}'
    range: 20

  action:
    commands: [me]
    format: '&e* &fMasked &d{message}'
    range: 20

  # ooc:
  #   commands: [ooc]
  #   format: '&f[&9OOC&f] &fMasked: &7{message}'
  #   range:

clues:
  recent-max: 6
  recent-cooldown-hours: 1
  critical-cooldown-hours: 24
  risk-gain-door:
    min: 0.05
    max: 0.15
  risk-gain-chest:
    min: 0.025
    max: 0.075
  risk-pick-reduction: 0.5
  risk-decay-per-hour: 0.08
  critical-base: 0.0
  critical-risk-weight: 0.5
  critical-dex-reduction: 0.15
  critical-strength-reduction: 0.2
  critical-clue: "§7This seems to be the work of {character_name}"

lockpicking:
  door-max-distance: 3
  lockpick-max-reduction: 0.5
  fail-cooldown-ms: 60000
  door-unlock-window-minutes: 60

  bar:
    length: 20
    max-success-slots: 3
    min-break-slots: 3
    max-break-slots: 19
    base-speed: 2.5
    dex-speed-reduction-per-level: 0.02
    min-speed: 0.4
    speed-jitter-fraction: 0.3
    random-flip-chance: 0.03

  attribute: dexterity

  chest:
    base-chance: 0.5
